<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小讲师演示</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; height:100vh; display:flex; background:#f0f2f5; }
.sidebar { width:280px; background:#fff; border-right:1px solid #e0e0e0; display:flex; flex-direction:column; }
.sidebar-header { padding:16px; background:#4a90d9; color:#fff; font-size:16px; font-weight:bold; }
.sidebar-list { flex:1; overflow-y:auto; padding:8px; }
.q-item { padding:10px 12px; margin:4px 0; border-radius:8px; cursor:pointer; font-size:13px; color:#333; transition:background .15s; }
.q-item:hover { background:#e8f0fe; }
.q-item.active { background:#4a90d9; color:#fff; }
.q-item .qid { font-size:11px; color:#999; margin-top:2px; }
.q-item.active .qid { color:#cce0f7; }
.sidebar-footer { padding:12px; border-top:1px solid #eee; }
.upload-btn { width:100%; padding:10px; border:2px dashed #bbb; border-radius:8px; background:#fafafa; cursor:pointer; font-size:13px; color:#666; text-align:center; }
.upload-btn:hover { border-color:#4a90d9; color:#4a90d9; }
.main { flex:1; display:flex; flex-direction:column; }
.chat-header { padding:16px 20px; background:#fff; border-bottom:1px solid #e0e0e0; font-size:15px; font-weight:bold; color:#333; }
.chat-area { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:12px; }
.msg { max-width:75%; padding:10px 14px; border-radius:12px; font-size:14px; line-height:1.6; white-space:pre-wrap; word-break:break-word; }
.msg.tutor { align-self:flex-start; background:#fff; border:1px solid #e0e0e0; border-top-left-radius:4px; }
.msg.student { align-self:flex-end; background:#4a90d9; color:#fff; border-top-right-radius:4px; }
.msg .meta { font-size:11px; color:#aaa; margin-top:4px; }
.msg.student .meta { color:#cce0f7; }
.typing { align-self:flex-start; background:#fff; border:1px solid #e0e0e0; padding:10px 14px; border-radius:12px; color:#999; font-size:13px; }
.input-area { padding:16px 20px; background:#fff; border-top:1px solid #e0e0e0; display:flex; gap:10px; }
.input-area input { flex:1; padding:12px 16px; border:1px solid #ddd; border-radius:24px; font-size:14px; outline:none; }
.input-area input:focus { border-color:#4a90d9; }
.input-area button { padding:12px 24px; background:#4a90d9; color:#fff; border:none; border-radius:24px; font-size:14px; cursor:pointer; }
.input-area button:disabled { background:#ccc; }
.empty-state { flex:1; display:flex; align-items:center; justify-content:center; color:#aaa; font-size:15px; }
.summary-box { background:#e8f5e9; border:1px solid #a5d6a7; padding:12px; border-radius:8px; margin-top:8px; font-size:13px; }
</style>
</head>
<body>
<div class="sidebar">
  <div class="sidebar-header">📚 小讲师题目列表</div>
  <div class="sidebar-list" id="qlist"><div style="padding:20px;color:#999;font-size:13px;">加载中…</div></div>
  <div class="sidebar-footer">
    <div class="upload-btn" onclick="document.getElementById('imgInput').click()">
      📷 拍照讲题(上传题图)<input type="file" id="imgInput" accept="image/jpeg,image/png,image/webp" style="display:none" onchange="uploadAndChat(this.files[0])">
    </div>
  </div>
</div>
<div class="main">
  <div class="chat-header" id="chatTitle">选择一道题开始对话</div>
  <div class="chat-area" id="chatArea">
    <div class="empty-state">← 从左侧选择一道题,或上传题图开始</div>
  </div>
  <div class="input-area">
    <input type="text" id="msgInput" placeholder="输入你的回答…" disabled onkeydown="if(event.key==='Enter')send()">
    <button id="sendBtn" onclick="send()" disabled>发送</button>
  </div>
</div>
<script>
const BASE = location.origin;
let TOKEN = '', CONV_ID = '', VERSION = 0, SKILL_SID = '', CURRENT_Q = '';

// ── 登录 ──
async function login() {
  const r = await fetch(`${BASE}/api/auth/login`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({account:'student1', password:'vl-night-77', role:'student'})
  });
  const d = await r.json();
  TOKEN = d.access_token || '';
}

// ── 题目列表 ──
async function loadQuestions() {
  await login();
  const r = await fetch(`${BASE}/api/conversations`, {headers:{'Authorization':`Bearer ${TOKEN}`}});
  // 题库列表从 seed bank 数据集静态渲染
  const qs = [
    {id:'chicken_rabbit', text:'鸡和兔一共有8只,共有26只脚。鸡和兔各有多少只?'},
    {id:'fraction_addition', text:'分数加法运算'},
    {id:'equation_subtract', text:'方程减法运算'},
    {id:'triangle_area', text:'三角形面积计算'},
    {id:'word_problem', text:'应用题·文字题'},
  ];
  const list = document.getElementById('qlist');
  list.innerHTML = '';
  qs.forEach(q => {
    const div = document.createElement('div');
    div.className = 'q-item';
    div.innerHTML = `<div>${q.text}</div><div class="qid">${q.id}</div>`;
    div.onclick = () => selectQuestion(q, div);
    list.appendChild(div);
  });
}

function selectQuestion(q, el) {
  document.querySelectorAll('.q-item').forEach(e => e.classList.remove('active'));
  el.classList.add('active');
  CURRENT_Q = q.id;
  document.getElementById('chatTitle').textContent = q.text;
  document.getElementById('chatArea').innerHTML = '';
  document.getElementById('msgInput').disabled = false;
  document.getElementById('sendBtn').disabled = false;
  createConversation(q.id);
}

// ── 创建会话 ──
async function createConversation(qid, imageFileId) {
  const body = {question_id: qid, idempotency_key: `demo-${Date.now()}-${Math.random().toString(36).slice(2,8)}`};
  if (imageFileId) body.question_image = imageFileId;
  showTyping();
  const r = await fetch(`${BASE}/api/conversations`, {
    method:'POST', headers:{'Content-Type':'application/json','Authorization':`Bearer ${TOKEN}`},
    body: JSON.stringify(body)
  });
  const d = await r.json();
  removeTyping();
  if (d.first_question) {
    CONV_ID = d.conversation_id;
    VERSION = d.session_version || 1;
    SKILL_SID = d.skill_session_id || '';
    addMsg('tutor', d.first_question);
    // 补充: 如果响应里有 skill_session_id 且从 active_session 拿,优先用
    const as = d.question?.active_session || d.active_session;
    if (as?.skill_session_id) SKILL_SID = as.skill_session_id;
    if (as?.session_version) VERSION = as.session_version;
  } else {
    addMsg('tutor', d.error?.message || '创建失败,请重试');
  }
}

// ── 发送消息 ──
async function send() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text || !CONV_ID) return;
  input.value = '';
  addMsg('student', text);
  showTyping();
  VERSION += 1;
  const r = await fetch(`${BASE}/api/conversations/${CONV_ID}/messages`, {
    method:'POST', headers:{'Content-Type':'application/json','Authorization':`Bearer ${TOKEN}`},
    body: JSON.stringify({
      content: text, skill_id: 'small_lecturer_coaching',
      input: {skill_session_id: SKILL_SID, expected_session_version: VERSION}
    })
  });
  const d = await r.json();
  removeTyping();
  if (d.assistant_message?.content) {
    addMsg('tutor', d.assistant_message.content);
    VERSION = d.session_version || VERSION;
    const iv = d.interaction || {};
    if (iv.attempt_state) updateTitle(iv.attempt_state);
    if (iv.result?.learning_summary) {
      addSummary(iv.result.learning_summary);
    }
  } else if (d.error) {
    addMsg('tutor', `出错了: ${d.error.message || d.error.code || '未知错误'}`);
  }
}

function addSummary(ls) {
  const area = document.getElementById('chatArea');
  const div = document.createElement('div');
  div.className = 'summary-box';
  div.innerHTML = `<b>📋 学习总结</b><br>
    掌握状态: ${ls.mastery_status || '—'}<br>
    学到了: ${ls.student_summary?.learned || '—'}<br>
    关键思路: ${(ls.student_summary?.key_ideas || []).join(';') || '—'}`;
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
}

function updateTitle(state) {
  const t = document.getElementById('chatTitle');
  t.textContent = `${CURRENT_Q} — ${state}`;
}

function addMsg(role, text) {
  const area = document.getElementById('chatArea');
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.textContent = text;
  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.textContent = role === 'tutor' ? '小讲师' : '学生';
  div.appendChild(meta);
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
}

function showTyping() {
  const area = document.getElementById('chatArea');
  const div = document.createElement('div');
  div.className = 'typing';
  div.id = 'typing';
  div.textContent = '小讲师正在思考…';
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
}
function removeTyping() { document.getElementById('typing')?.remove(); }

// ── 拍照讲题 ──
async function uploadAndChat(file) {
  if (!file) return;
  if (!TOKEN) await login();
  showTyping();
  try {
    // 第1步: 申请上传
    const ur = await fetch(`${BASE}/api/files/upload-request`, {
      method:'POST', headers:{'Content-Type':'application/json','Authorization':`Bearer ${TOKEN}`},
      body: JSON.stringify({filename:file.name, content_type:file.type,
        size_bytes:file.size, purpose:'micro_lesson_question_image'})
    });
    const ud = await ur.json();
    if (!ud.file_id) throw new Error(ud.error?.message || '上传申请失败');
    // 第2步: 上传内容
    await fetch(ud.upload_url, {method: ud.upload_method || 'PUT',
      headers: ud.headers || {'Content-Type': file.type}, body: file});
    // 第3步: 确认
    await fetch(`${BASE}/api/files/complete`, {
      method:'POST', headers:{'Content-Type':'application/json','Authorization':`Bearer ${TOKEN}`},
      body: JSON.stringify({file_id: ud.file_id, size_bytes: file.size})});
    // 第4步: 创建会话
    CURRENT_Q = `拍照讲题: ${file.name}`;
    document.getElementById('chatTitle').textContent = CURRENT_Q;
    document.getElementById('chatArea').innerHTML = '';
    document.getElementById('msgInput').disabled = false;
    document.getElementById('sendBtn').disabled = false;
    await createConversation(file.name.replace(/\.\w+$/,''), ud.file_id);
  } catch(e) {
    removeTyping();
    addMsg('tutor', `上传失败: ${e.message || e}`);
  }
}

loadQuestions();
</script>
</body>
</html>
