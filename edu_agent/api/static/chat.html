<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小讲师演示</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; height:100vh; display:flex; background:#f0f2f5; }
.sidebar { width:300px; background:#fff; border-right:1px solid #e0e0e0; display:flex; flex-direction:column; }
.sidebar-header { padding:14px 16px; background:#4a90d9; color:#fff; font-size:16px; font-weight:bold; }
.search-box { padding:8px; border-bottom:1px solid #eee; }
.search-box input { width:100%; padding:8px 12px; border:1px solid #ddd; border-radius:6px; font-size:13px; outline:none; }
.sidebar-list { flex:1; overflow-y:auto; padding:6px; }
.q-group { font-size:11px; color:#999; padding:8px 10px 4px; }
.q-item { padding:9px 12px; margin:2px 0; border-radius:8px; cursor:pointer; font-size:13px; color:#333; transition:background .15s; }
.q-item:hover { background:#e8f0fe; }
.q-item.active { background:#4a90d9; color:#fff; }
.q-item .qid { font-size:11px; color:#999; margin-top:2px; }
.q-item.active .qid { color:#cce0f7; }
.q-item .has-img { color:#4a90d9; font-size:11px; }
.q-item.active .has-img { color:#cce0f7; }
.sidebar-footer { padding:12px; border-top:1px solid #eee; }
.upload-btn { width:100%; padding:10px; border:2px dashed #bbb; border-radius:8px; background:#fafafa; cursor:pointer; font-size:13px; color:#666; text-align:center; }
.upload-btn:hover { border-color:#4a90d9; color:#4a90d9; }
.main { flex:1; display:flex; flex-direction:column; }
.chat-header { padding:16px 20px; background:#fff; border-bottom:1px solid #e0e0e0; font-size:15px; font-weight:bold; color:#333; display:flex; justify-content:space-between; align-items:center; }
.restart-btn { padding:6px 14px; background:#fff; color:#4a90d9; border:1px solid #4a90d9; border-radius:16px; font-size:13px; cursor:pointer; }
.restart-btn:hover { background:#e8f0fe; }
.chat-area { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:12px; }
.msg { max-width:75%; padding:10px 14px; border-radius:12px; font-size:14px; line-height:1.6; white-space:pre-wrap; word-break:break-word; }
.msg.tutor { align-self:flex-start; background:#fff; border:1px solid #e0e0e0; border-top-left-radius:4px; }
.msg.student { align-self:flex-end; background:#4a90d9; color:#fff; border-top-right-radius:4px; }
.msg .meta { font-size:11px; color:#aaa; margin-top:4px; }
.msg.student .meta { color:#cce0f7; }
.msg img { max-width:220px; border-radius:8px; margin-top:6px; border:1px solid #eee; }
.typing { align-self:flex-start; background:#fff; border:1px solid #e0e0e0; padding:10px 14px; border-radius:12px; color:#999; font-size:13px; }
.input-area { padding:16px 20px; background:#fff; border-top:1px solid #e0e0e0; display:flex; gap:10px; }
.input-area input { flex:1; padding:12px 16px; border:1px solid #ddd; border-radius:24px; font-size:14px; outline:none; }
.input-area input:focus { border-color:#4a90d9; }
.input-area button { padding:12px 24px; background:#4a90d9; color:#fff; border:none; border-radius:24px; font-size:14px; cursor:pointer; }
.input-area button:disabled { background:#ccc; }
.empty-state { flex:1; display:flex; align-items:center; justify-content:center; color:#aaa; font-size:15px; }
.summary-box { background:#e8f5e9; border:1px solid #a5d6a7; padding:12px; border-radius:8px; margin-top:8px; font-size:13px; }
.status-note { align-self:center; color:#999; font-size:12px; background:#f5f5f5; padding:4px 12px; border-radius:10px; }
</style>
</head>
<body>
<div class="sidebar">
  <div class="sidebar-header">📚 真实题库(263 题)</div>
  <div class="search-box"><input type="text" id="qSearch" placeholder="搜索题目/知识点…" oninput="renderList()"></div>
  <div class="sidebar-list" id="qlist"><div style="padding:20px;color:#999;font-size:13px;">加载中…</div></div>
  <div class="sidebar-footer">
    <div class="upload-btn" onclick="document.getElementById('imgInput').click()">
      📷 拍照讲题(上传题图)<input type="file" id="imgInput" accept="image/jpeg,image/png,image/webp" style="display:none" onchange="uploadAndChat(this.files[0])">
    </div>
  </div>
</div>
<div class="main">
  <div class="chat-header"><span id="chatTitle">选择一道题开始对话</span><button class="restart-btn" id="restartBtn" style="display:none" onclick="restartLearning()">🔄 重新开始</button></div>
  <div class="chat-area" id="chatArea">
    <div class="empty-state">← 从左侧选择一道题(自动上传题图),或拍照讲题</div>
  </div>
  <div class="input-area">
    <input type="text" id="msgInput" placeholder="输入你的回答…" disabled onkeydown="if(event.key==='Enter')send()">
    <button id="sendBtn" onclick="send()" disabled>发送</button>
  </div>
</div>
<script>
const BASE = location.origin;
let TOKEN = '', CONV_ID = '', VERSION = 0, SKILL_SID = '', CURRENT_Q = '', BANK = [], MODE = null;
// MODE = {type:'bank', q} | {type:'photo', fid, name}(重新开始所需的最小重开材料)

// 渲染层 HTML 转义(#113 P2/#221):题库文本/错误消息/总结字段进 innerHTML 前的唯一出口。
// 数据链不动,只改渲染;<script>/<img onerror> 等载荷经此落 DOM 只能是文本。
function escapeHtml(v) {
  return String(v ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}
const BADGE_HAS_IMG = ' <span class="has-img">🖼 题图</span>'; // 静态标记(模板自有内容,非数据),全大写常量约定

// ── 登录(演示账密) ──
async function login() {
  const r = await fetch(`${BASE}/api/auth/login`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({account:'student1', password:'student1', role:'student'})
  });
  const d = await r.json();
  TOKEN = d.access_token || '';
  if (!TOKEN) throw new Error('登录失败:' + JSON.stringify(d.error||d));
}

// ── 题库列表(真实题库快照) ──
async function loadQuestions() {
  try {
    await login();
    const r = await fetch(`${BASE}/static/bank.json`);
    BANK = await r.json();
    renderList();
  } catch (e) {
    document.getElementById('qlist').innerHTML = `<div style="padding:20px;color:#c00;font-size:13px;">加载失败:${escapeHtml(e.message)}</div>`;
  }
}

function renderList() {
  const kw = document.getElementById('qSearch').value.trim();
  const list = document.getElementById('qlist');
  list.innerHTML = '';
  let lastSubject = null;
  BANK.filter(q => !kw || q.text.includes(kw) || q.subject.includes(kw) || q.id.includes(kw))
    .forEach(q => {
      if (q.subject !== lastSubject) {
        const g = document.createElement('div');
        g.className = 'q-group'; g.textContent = q.subject || '未分类';
        list.appendChild(g); lastSubject = q.subject;
      }
      const div = document.createElement('div');
      div.className = 'q-item';
      div.innerHTML = `<div>${escapeHtml(q.text || q.id)}</div><div class="qid">${escapeHtml(q.id)}${q.image ? BADGE_HAS_IMG : ''}</div>`;
      div.onclick = () => selectQuestion(q, div);
      list.appendChild(div);
    });
}

function selectQuestion(q, el) {
  document.querySelectorAll('.q-item').forEach(e => e.classList.remove('active'));
  el.classList.add('active');
  MODE = {type:'bank', q};
  CURRENT_Q = q.id;
  document.getElementById('chatTitle').textContent = q.text || q.id;
  document.getElementById('chatArea').innerHTML = '';
  document.getElementById('msgInput').disabled = false;
  document.getElementById('sendBtn').disabled = false;
  openWithQuestion(q);
}

// 重新开始:同题新幂等键开全新会话(旧对话已落盘 data/sessions/ 供复盘)
function restartLearning() {
  if (!MODE) return;
  document.getElementById('chatArea').innerHTML = '';
  document.getElementById('restartBtn').style.display = 'none';
  if (MODE.type === 'bank') { openWithQuestion(MODE.q); return; }
  // 拍照题:file_id 复用(已上传文件无需重传),纯图重新开题
  openByImage(MODE.fid, MODE.name);
}

// ── 统一 Open:external_question_id + (有题图时)上传后传 file_id ──
async function openWithQuestion(q) {
  showTyping();
  try {
    let imageFileId = '';
    if (q.image) {
      addNote('上传题图中…');
      const blob = await (await fetch(BASE + q.image)).blob();
      imageFileId = await uploadFile(blob, `${q.id}.jpg`, 'image/jpeg');
      addNote('题图上传完成,开题中…');
    }
    const body = {external_question_id: q.id,
                  idempotency_key: `demo-${q.id}-${Date.now()}`};
    if (imageFileId) body.question_image = imageFileId;
    const r = await fetch(`${BASE}/api/prepared-questions/open`, {
      method:'POST', headers:{'Content-Type':'application/json','Authorization':`Bearer ${TOKEN}`},
      body: JSON.stringify(body)
    });
    const d = await r.json();
    removeTyping();
    if (!d.question?.active_session) {
      addMsg('tutor', d.error?.message || '开题失败,请重试'); return;
    }
    const as = d.question.active_session;
    CONV_ID = as.conversation; SKILL_SID = as.skill_session_id; VERSION = as.session_version || 1;
    document.getElementById('restartBtn').style.display = '';
    await showFirstQuestion();
  } catch (e) {
    removeTyping();
    addMsg('tutor', `开题失败: ${e.message || e}`);
  }
}

// 纯图开题(拍照讲题与重新开始共用;fid 为已上传 file_id)
async function openByImage(fid, name) {
  showTyping();
  try {
    const r = await fetch(`${BASE}/api/prepared-questions/open`, {
      method:'POST', headers:{'Content-Type':'application/json','Authorization':`Bearer ${TOKEN}`},
      body: JSON.stringify({question_image: fid, idempotency_key: `demo-photo-${Date.now()}`})
    });
    const d = await r.json();
    removeTyping();
    const as = d.question?.active_session;
    if (!as) { addMsg('tutor', d.error?.message || '开题失败'); return; }
    CONV_ID = as.conversation; SKILL_SID = as.skill_session_id; VERSION = as.session_version || 1;
    document.getElementById('restartBtn').style.display = '';
    await showFirstQuestion();
  } catch (e) {
    removeTyping();
    addMsg('tutor', `开题失败: ${e.message || e}`);
  }
}

// 首问从 refresh 端点取(统一 open 信封不含首问文本)
async function showFirstQuestion() {
  showTyping();
  const r = await fetch(`${BASE}/api/conversations/${CONV_ID}/skill-sessions/${SKILL_SID}/refresh`, {
    method:'POST', headers:{'Authorization':`Bearer ${TOKEN}`}});
  const d = await r.json();
  removeTyping();
  if (d.assistant_message?.content) addMsg('tutor', d.assistant_message.content);
}

// ── 三步上传 ──
async function uploadFile(blob, filename, contentType) {
  const ur = await fetch(`${BASE}/api/files/upload-request`, {
    method:'POST', headers:{'Content-Type':'application/json','Authorization':`Bearer ${TOKEN}`},
    body: JSON.stringify({filename, content_type: contentType,
      size_bytes: blob.size, purpose:'micro_lesson_question_image'})
  });
  const ud = await ur.json();
  if (!ud.file_id) throw new Error(ud.error?.message || '上传申请失败');
  const pr = await fetch(ud.upload_url, {method:'PUT',
    headers:{'Content-Type': contentType, 'Authorization':`Bearer ${TOKEN}`}, body: blob});
  if (!pr.ok) throw new Error('上传内容失败 HTTP ' + pr.status);
  await fetch(`${BASE}/api/files/complete`, {
    method:'POST', headers:{'Content-Type':'application/json','Authorization':`Bearer ${TOKEN}`},
    body: JSON.stringify({file_id: ud.file_id, size_bytes: blob.size})});
  return ud.file_id;
}

// ── 发送消息 ──
async function send() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text || !CONV_ID) return;
  input.value = '';
  addMsg('student', text);
  showTyping();
  // expected_session_version = 服务端当前版本(不预自增);成功后从响应取新版本
  const r = await fetch(`${BASE}/api/conversations/${CONV_ID}/messages`, {
    method:'POST', headers:{'Content-Type':'application/json','Authorization':`Bearer ${TOKEN}`},
    body: JSON.stringify({
      content: text, skill_id: 'small_lecturer_coaching',
      input: {skill_session_id: SKILL_SID, expected_session_version: VERSION}
    })
  });
  const d = await r.json();
  removeTyping();
  if (d.assistant_message?.content) {
    addMsg('tutor', d.assistant_message.content);
    VERSION = d.session_version || (VERSION + 1);
    const iv = d.interaction || d.skill_interaction || {};
    if (iv.attempt_state) updateTitle(iv.attempt_state);
    if (iv.result?.learning_summary) addSummary(iv.result.learning_summary);
  } else if (d.error?.code === 'SKILL_SESSION_CONFLICT' && CONV_ID) {
    // 版本过期自愈:拉最新 interaction 同步版本,学生决定是否重发
    addNote('会话版本已过期,正在同步最新进度…');
    try {
      const rr = await fetch(`${BASE}/api/conversations/${CONV_ID}/skill-sessions/${SKILL_SID}/refresh`, {
        method:'POST', headers:{'Authorization':`Bearer ${TOKEN}`}});
      const rd = await rr.json();
      VERSION = rd.session_version || rd.skill_interaction?.session_version || VERSION;
      addNote('已同步到最新版本,请重新发送你的回答');
    } catch { addMsg('tutor', '同步会话失败,请刷新页面重试'); }
  } else if (d.error) {
    addMsg('tutor', `出错了: ${d.error.message || d.error.code || '未知错误'}`);
  }
}

function addSummary(ls) {
  const area = document.getElementById('chatArea');
  const div = document.createElement('div');
  div.className = 'summary-box';
  div.innerHTML = `<b>📋 学习总结</b><br>
    掌握状态: ${escapeHtml(ls.mastery_status || '—')}<br>
    学到了: ${escapeHtml(ls.student_summary?.learned || '—')}<br>
    关键思路: ${escapeHtml((ls.student_summary?.key_ideas || []).join(';') || '—')}`;
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
}

function updateTitle(state) {
  document.getElementById('chatTitle').textContent = `${CURRENT_Q} — ${state}`;
}

function addMsg(role, text) {
  const area = document.getElementById('chatArea');
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.textContent = text;
  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.textContent = role === 'tutor' ? '小讲师' : '学生';
  div.appendChild(meta);
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
}
function addNote(text) {
  const area = document.getElementById('chatArea');
  const div = document.createElement('div');
  div.className = 'status-note'; div.textContent = text;
  area.appendChild(div); area.scrollTop = area.scrollHeight;
}

function showTyping() {
  const area = document.getElementById('chatArea');
  const div = document.createElement('div');
  div.className = 'typing';
  div.id = 'typing';
  div.textContent = '小讲师正在思考…';
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
}
function removeTyping() { document.getElementById('typing')?.remove(); }

// ── 拍照讲题(纯题图 → vision 转写) ──
async function uploadAndChat(file) {
  if (!file) return;
  if (!TOKEN) await login();
  showTyping();
  try {
    const fid = await uploadFile(file, file.name, file.type);
    addNote('题图上传完成,识别题目中…');
    MODE = {type:'photo', fid, name:file.name};
    CURRENT_Q = `拍照讲题: ${file.name}`;
    document.getElementById('chatTitle').textContent = CURRENT_Q;
    document.getElementById('chatArea').innerHTML = '';
    document.getElementById('msgInput').disabled = false;
    document.getElementById('sendBtn').disabled = false;
    await openByImage(fid, file.name);
  } catch(e) {
    removeTyping();
    addMsg('tutor', `上传失败: ${e.message || e}`);
  }
}

loadQuestions();
</script>
</body>
</html>
